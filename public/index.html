<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COMMS TERMINAL</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --captain-color: #00ffcc;
      --architect-color: #ff6b35;
      --bg-primary: #0a0e14;
      --bg-secondary: #111922;
      --border-color: #1a2a3a;
      --text-dim: #4a6a7a;
      --scanline-opacity: 0.03;
    }

    body {
      color: #c0d0e0;
      font-family: 'JetBrains Mono', monospace;
      height: 100vh;
      overflow: hidden;
      position: relative;
      /* Ship interior hull */
      background:
        linear-gradient(180deg, #1d2228 0%, #14181d 12%, #14181d 88%, #0e1116 100%),
        var(--bg-primary);
    }

    /* Side bulkheads — structural frame flanking the viewport pane */
    .hull-strut {
      position: fixed;
      top: 0;
      bottom: 0;
      width: calc((100% - 1200px) / 2 + 24px);
      min-width: 24px;
      z-index: 0;
      pointer-events: none;
      background:
        linear-gradient(90deg, #2a3038 0%, #20252b 40%, #15191e 100%);
      border-right: 2px solid #0a0d11;
      box-shadow: inset -6px 0 14px rgba(0,0,0,0.6), inset 2px 0 0 rgba(255,255,255,0.04);
    }
    .hull-strut.right {
      left: auto;
      right: 0;
      background: linear-gradient(270deg, #2a3038 0%, #20252b 40%, #15191e 100%);
      border-right: none;
      border-left: 2px solid #0a0d11;
      box-shadow: inset 6px 0 14px rgba(0,0,0,0.6), inset -2px 0 0 rgba(255,255,255,0.04);
    }
    .hull-strut.left { left: 0; }
    /* riveted panel seams + warning stripe down each bulkhead */
    .hull-strut::before {
      content: '';
      position: absolute;
      top: 0; bottom: 0;
      width: 10px;
      background: repeating-linear-gradient(180deg, #c9a227 0 14px, #1a1a1a 14px 28px);
      opacity: 0.5;
    }
    .hull-strut.left::before  { right: 6px; }
    .hull-strut.right::before { left: 6px; }
    .hull-strut::after {
      content: '';
      position: absolute;
      top: 8%; bottom: 8%;
      width: 14px;
      border-radius: 4px;
      background:
        radial-gradient(circle at 50% 4%, #3a424c 2px, transparent 2.6px) 0 0 / 14px 60px,
        linear-gradient(90deg, #30363e, #20252b);
      box-shadow: inset 0 0 6px rgba(0,0,0,0.6);
    }
    .hull-strut.left::after  { left: 18px; }
    .hull-strut.right::after { right: 18px; }

    @media (max-width: 1240px) {
      .hull-strut { width: 24px; }
    }

    /* Scanline effect */
    body::after {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0, 255, 204, var(--scanline-opacity)) 2px,
        rgba(0, 255, 204, var(--scanline-opacity)) 4px
      );
      z-index: 1000;
    }

    /* CRT flicker */
    @keyframes flicker {
      0%, 100% { opacity: 1; }
      92% { opacity: 1; }
      93% { opacity: 0.8; }
      94% { opacity: 1; }
    }

    body {
      animation: flicker 8s infinite;
    }

    .container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 22px 26px;
      max-width: 1200px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
      /* recessed viewport pane set into the hull wall */
      background:
        radial-gradient(ellipse at 50% 0%, rgba(0,255,204,0.03), transparent 60%),
        linear-gradient(180deg, #0c1016, #090c11);
      border-left: 2px solid #3a424c;
      border-right: 2px solid #3a424c;
      box-shadow:
        inset 0 0 40px rgba(0,0,0,0.7),
        -8px 0 18px rgba(0,0,0,0.5),
        8px 0 18px rgba(0,0,0,0.5);
    }

    /* Top half: chat viewscreen */
    .chat-deck {
      display: flex;
      flex-direction: column;
      height: 56vh;
      min-height: 0;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(0,255,204,0.04), transparent 70%),
        var(--bg-primary);
      padding: 14px;
      box-shadow: inset 0 0 60px rgba(0,255,204,0.03), 0 0 30px rgba(0,0,0,0.5);
      position: relative;
    }

    .architect-view .chat-deck {
      background:
        radial-gradient(ellipse at 50% 0%, rgba(255,107,53,0.04), transparent 70%),
        var(--bg-primary);
    }

    /* Bottom half: USS Endeavor console */
    .console-deck {
      flex: 1;
      min-height: 0;
      margin-top: 16px;
      display: grid;
      grid-template-columns: 1.5fr 1.05fr 1.3fr;
      gap: 14px;
    }

    .panel {
      position: relative;
      background: linear-gradient(160deg, #363b42 0%, #20242a 60%, #181b20 100%);
      border: 1px solid #4a515b;
      border-top-color: #5b636e;
      border-radius: 6px;
      padding: 11px 12px 18px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 6px 16px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.06);
    }

    /* yellow LED strip along the bottom bezel */
    .panel::after {
      content: '';
      position: absolute;
      left: 16px; right: 16px; bottom: 6px;
      height: 5px;
      border-radius: 2px;
      background: repeating-linear-gradient(90deg, #f5d020 0 5px, rgba(0,0,0,0.45) 5px 11px);
      opacity: 0.85;
    }

    .panel-title {
      font-size: 9px;
      letter-spacing: 2px;
      color: var(--text-dim);
      text-transform: uppercase;
      margin-bottom: 9px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border-color);
    }

    /* Plain panels (reverted to original page style) */
    .panel.plain {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 12px 14px;
      box-shadow: none;
    }
    .panel.plain::after { content: none; }

    /* Equalizer (SIGNAL FLUX) — static bars */
    .equalizer {
      flex: 1;
      display: flex;
      align-items: flex-end;
      gap: 4px;
    }
    .equalizer span {
      flex: 1;
      background: linear-gradient(to top, var(--captain-color), rgba(0,255,204,0.2));
      border-radius: 2px 2px 0 0;
    }
    .equalizer span:nth-child(1)  { height: 55%; }
    .equalizer span:nth-child(2)  { height: 70%; }
    .equalizer span:nth-child(3)  { height: 45%; }
    .equalizer span:nth-child(4)  { height: 80%; }
    .equalizer span:nth-child(5)  { height: 60%; }
    .equalizer span:nth-child(6)  { height: 50%; }
    .equalizer span:nth-child(7)  { height: 75%; }
    .equalizer span:nth-child(8)  { height: 40%; }
    .equalizer span:nth-child(9)  { height: 65%; }
    .equalizer span:nth-child(10) { height: 58%; }
    .equalizer span:nth-child(11) { height: 72%; }
    .equalizer span:nth-child(12) { height: 48%; }
    .equalizer span:nth-child(13) { height: 68%; }
    .equalizer span:nth-child(14) { height: 54%; }
    .equalizer span:nth-child(15) { height: 78%; }
    .equalizer span:nth-child(16) { height: 44%; }
    .equalizer span:nth-child(17) { height: 62%; }
    .equalizer span:nth-child(18) { height: 56%; }

    /* Gauges (CORE SYSTEMS) */
    .gauges {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 9px;
    }
    .gauge {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 10px;
      color: var(--text-dim);
    }
    .gauge label { width: 26px; letter-spacing: 1px; }
    .gauge-bar {
      flex: 1;
      height: 8px;
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      border-radius: 3px;
      overflow: hidden;
    }
    .gauge-bar i {
      display: block;
      height: 100%;
      background: linear-gradient(90deg, var(--captain-color), rgba(0,255,204,0.4));
    }

    /* cyan glass screen inside a panel (TACTICAL SCAN) */
    .screen {
      flex: 1;
      min-height: 0;
      position: relative;
      border: 1px solid #1d6475;
      border-radius: 4px;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(40,200,230,0.18), transparent 70%),
        linear-gradient(180deg, #0c2c37, #061319);
      box-shadow: inset 0 0 26px rgba(0,210,240,0.12);
      padding: 8px 10px;
      overflow: hidden;
    }

    /* RIGHT: tactical HUD / radar with WARNING */
    .hud {
      display: grid;
      grid-template-columns: 1fr 1.3fr;
      gap: 8px;
    }
    .hud-left {
      display: flex;
      flex-direction: column;
      gap: 6px;
      justify-content: center;
    }
    .hud-readout {
      height: 7px;
      border-radius: 2px;
      background: linear-gradient(90deg, #5fd6e8 var(--w,60%), #123039 var(--w,60%));
      box-shadow: 0 0 5px rgba(95,214,232,0.3);
    }
    .radar {
      position: relative;
      align-self: center;
      justify-self: center;
      width: 100%;
      aspect-ratio: 1 / 1;
      max-height: 100%;
      border-radius: 50%;
      border: 1px solid rgba(95,214,232,0.4);
      box-shadow: inset 0 0 18px rgba(95,214,232,0.15);
      overflow: hidden;
    }
    .radar-ring {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      border: 1px solid rgba(95,214,232,0.22);
      border-radius: 50%;
    }
    .radar-ring.r1 { width: 66%; height: 66%; }
    .radar-ring.r2 { width: 33%; height: 33%; }
    .radar-cross-h, .radar-cross-v {
      position: absolute;
      background: rgba(95,214,232,0.18);
    }
    .radar-cross-h { top: 50%; left: 0; width: 100%; height: 1px; }
    .radar-cross-v { left: 50%; top: 0; height: 100%; width: 1px; }
    .radar-sweep {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: conic-gradient(from 0deg, rgba(95,214,232,0.4), transparent 60deg);
      animation: sweep 3.5s linear infinite;
    }
    @keyframes sweep { to { transform: rotate(360deg); } }
    .radar-blip {
      position: absolute;
      width: 5px; height: 5px;
      border-radius: 50%;
      background: #ff5e4d;
      box-shadow: 0 0 7px #ff5e4d;
      animation: blip 3.5s ease-in-out infinite;
    }
    .radar-blip.b1 { top: 30%; left: 62%; animation-delay: 0.6s; }
    .radar-blip.b2 { top: 64%; left: 40%; animation-delay: 2.0s; }
    @keyframes blip {
      0%, 100% { opacity: 0; }
      10%      { opacity: 1; }
      60%      { opacity: 0.2; }
    }
    .warning {
      position: absolute;
      right: 8px; bottom: 8px;
      font-size: 9px;
      letter-spacing: 1px;
      color: #ff5e4d;
      border: 1px solid #ff5e4d;
      padding: 2px 6px;
      border-radius: 2px;
      background: rgba(40,8,8,0.6);
      animation: warnPulse 1.4s ease-in-out infinite;
    }
    @keyframes warnPulse {
      0%, 100% { opacity: 1; box-shadow: 0 0 8px rgba(255,94,77,0.5); }
      50%      { opacity: 0.45; box-shadow: none; }
    }

    @media (max-height: 700px) {
      .chat-deck { height: 52vh; }
    }

    /* Header */
    .header {
      border: 1px solid var(--border-color);
      padding: 15px 20px;
      margin-bottom: 20px;
      background: var(--bg-secondary);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-title {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    .header-status {
      font-size: 11px;
      color: var(--text-dim);
    }

    .header-status .online {
      color: #00ff88;
    }

    .reset-btn {
      margin-left: 14px;
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-dim);
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 2px;
      padding: 4px 10px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .reset-btn:hover {
      border-color: var(--architect-color);
      color: var(--architect-color);
    }

    /* Messages area */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 0;
      scroll-behavior: smooth;
    }

    .messages::-webkit-scrollbar {
      width: 4px;
    }

    .messages::-webkit-scrollbar-track {
      background: var(--bg-primary);
    }

    .messages::-webkit-scrollbar-thumb {
      background: var(--border-color);
    }

    .message {
      margin-bottom: 24px;
      padding-left: 20px;
      border-left: 2px solid var(--border-color);
      animation: messageIn 0.3s ease-out;
    }

    @keyframes messageIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message.captain {
      border-left-color: var(--captain-color);
    }

    .message.architect {
      border-left-color: var(--architect-color);
    }

    .message-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 6px;
    }

    .message-role {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .message.captain .message-role {
      color: var(--captain-color);
    }

    .message.architect .message-role {
      color: var(--architect-color);
    }

    .message-time {
      font-size: 10px;
      color: var(--text-dim);
    }

    .message-text {
      font-size: 16px;
      line-height: 1.6;
      font-weight: 300;
    }

    .message-text .cursor {
      display: inline-block;
      width: 8px;
      height: 18px;
      background: currentColor;
      margin-left: 2px;
      animation: blink 0.6s step-end infinite;
      vertical-align: text-bottom;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* Typing indicator */
    .typing-indicator {
      padding-left: 20px;
      margin-bottom: 16px;
      font-size: 14px;
      color: var(--text-dim);
      opacity: 0;
      transition: opacity 0.3s;
    }

    .typing-indicator.active {
      opacity: 1;
    }

    /* Input area */
    .input-area {
      border: 1px solid var(--border-color);
      background: var(--bg-secondary);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .input-prompt {
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
    }

    .captain-view .input-prompt {
      color: var(--captain-color);
    }

    .architect-view .input-prompt {
      color: var(--architect-color);
    }

    .input-field {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #c0d0e0;
      font-family: 'JetBrains Mono', monospace;
      font-size: 16px;
      font-weight: 300;
    }

    .input-field::placeholder {
      color: var(--text-dim);
    }

    .send-hint {
      font-size: 10px;
      color: var(--text-dim);
    }

    /* Role selection */
    .role-select {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--bg-primary);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 2000;
    }

    .role-select h1 {
      font-size: 12px;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 40px;
    }

    .role-buttons {
      display: flex;
      gap: 30px;
    }

    .role-btn {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      color: #c0d0e0;
      font-family: 'JetBrains Mono', monospace;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      padding: 30px 50px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .role-btn:hover {
      border-color: var(--captain-color);
      color: var(--captain-color);
      box-shadow: 0 0 20px rgba(0, 255, 204, 0.1);
    }

    .role-btn:last-child:hover {
      border-color: var(--architect-color);
      color: var(--architect-color);
      box-shadow: 0 0 20px rgba(255, 107, 53, 0.1);
    }

    /* Ambient glow */
    .ambient-glow {
      position: fixed;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      pointer-events: none;
      background: radial-gradient(ellipse at 50% 50%, rgba(0, 255, 204, 0.02) 0%, transparent 70%);
      z-index: -1;
    }
  </style>
</head>
<body>
  <div class="ambient-glow"></div>
  <div class="hull-strut left" aria-hidden="true"></div>
  <div class="hull-strut right" aria-hidden="true"></div>

  <!-- Role selection screen -->
  <div class="role-select" id="roleSelect">
    <h1>Identify yourself</h1>
    <div class="role-buttons">
      <button class="role-btn" onclick="selectRole('captain')">Captain</button>
      <button class="role-btn" onclick="selectRole('architect')">Architect</button>
    </div>
  </div>

  <!-- Chat interface -->
  <div class="container" id="chatContainer" style="display:none;">

    <!-- TOP HALF: viewscreen / chat -->
    <div class="chat-deck">
      <div class="header">
        <div class="header-title" id="headerTitle">COMMS TERMINAL</div>
        <div class="header-status">
          <span>CHANNEL OPEN</span> · <span class="online">ENCRYPTED</span>
          <button class="reset-btn" id="resetBtn" title="Clear all transmissions (Cmd+\)">RESET</button>
        </div>
      </div>

      <div class="messages" id="messages"></div>

      <div class="typing-indicator" id="typingIndicator">
        <span id="typingText"></span>
      </div>

      <div class="input-area">
        <span class="input-prompt" id="inputPrompt">&gt;</span>
        <input type="text" class="input-field" id="inputField" placeholder="Enter transmission..." autocomplete="off" />
        <span class="send-hint">ENTER TO TRANSMIT</span>
      </div>
    </div>

    <!-- BOTTOM HALF: USS Endeavor console -->
    <div class="console-deck" aria-hidden="true">

      <!-- LEFT: signal flux -->
      <div class="panel plain">
        <div class="panel-title">SIGNAL FLUX</div>
        <div class="equalizer">
          <span></span><span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span>
        </div>
      </div>

      <!-- MIDDLE: core systems -->
      <div class="panel plain">
        <div class="panel-title">CORE SYSTEMS</div>
        <div class="gauges">
          <div class="gauge"><label>PWR</label><div class="gauge-bar"><i style="width:82%"></i></div></div>
          <div class="gauge"><label>O₂</label><div class="gauge-bar"><i style="width:96%"></i></div></div>
          <div class="gauge"><label>THR</label><div class="gauge-bar"><i style="width:64%"></i></div></div>
          <div class="gauge"><label>HUL</label><div class="gauge-bar"><i style="width:91%"></i></div></div>
          <div class="gauge"><label>NAV</label><div class="gauge-bar"><i style="width:73%"></i></div></div>
        </div>
      </div>

      <!-- RIGHT: tactical HUD / radar -->
      <div class="panel">
        <div class="panel-title">TACTICAL SCAN</div>
        <div class="screen hud">
          <div class="hud-left">
            <div class="hud-readout" style="--w:78%"></div>
            <div class="hud-readout" style="--w:46%"></div>
            <div class="hud-readout" style="--w:62%"></div>
            <div class="hud-readout" style="--w:34%"></div>
            <div class="hud-readout" style="--w:88%"></div>
          </div>
          <div class="radar">
            <div class="radar-ring r1"></div>
            <div class="radar-ring r2"></div>
            <div class="radar-cross-h"></div>
            <div class="radar-cross-v"></div>
            <div class="radar-sweep"></div>
            <div class="radar-blip b1"></div>
            <div class="radar-blip b2"></div>
          </div>
          <div class="warning">WARNING !</div>
        </div>
      </div>

    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let myRole = null;
    let typingTimeout = null;

    // Auto-detect role from URL
    const path = window.location.pathname;
    if (path === '/captain') {
      selectRole('captain');
    } else if (path === '/architect') {
      selectRole('architect');
    }

    function selectRole(role) {
      myRole = role;
      document.getElementById('roleSelect').style.display = 'none';
      document.getElementById('chatContainer').style.display = 'flex';
      document.body.classList.add(role + '-view');

      const prompt = role === 'captain' ? 'CAPTAIN >' : 'ARCHITECT >';
      document.getElementById('inputPrompt').textContent = prompt;
      document.getElementById('headerTitle').textContent =
        `COMMS TERMINAL — ${role.toUpperCase()}`;

      socket.emit('join', role);
      document.getElementById('inputField').focus();
    }

    // Handle message history
    socket.on('history', (msgs) => {
      msgs.forEach(msg => renderMessage(msg, false));
      scrollToBottom();
    });

    // Handle new messages
    socket.on('message', (msg) => {
      if (msg.role !== myRole) hideTypingIndicator();
      renderMessage(msg, false);
      scrollToBottom();
    });

    // Show "<role> is typing..." when the other party is composing
    socket.on('typing', (data) => {
      if (data.role === myRole) return;
      showTypingIndicator(data.role);
    });

    socket.on('stop-typing', (data) => {
      if (data.role === myRole) return;
      hideTypingIndicator();
    });

    function renderMessage(msg, typewriter) {
      const container = document.getElementById('messages');
      const div = document.createElement('div');
      div.className = `message ${msg.role}`;

      const time = new Date(msg.timestamp).toLocaleTimeString('en-US', {
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        hour12: false
      });

      div.innerHTML = `
        <div class="message-header">
          <span class="message-role">${msg.role}</span>
          <span class="message-time">${time}</span>
        </div>
        <div class="message-text"><span class="text-content"></span></div>
      `;

      container.appendChild(div);
      const textEl = div.querySelector('.text-content');

      if (typewriter && msg.text.length > 0) {
        typewriterEffect(textEl, msg.text);
      } else {
        textEl.textContent = msg.text;
      }
    }

    function typewriterEffect(element, text) {
      let i = 0;
      const cursor = document.createElement('span');
      cursor.className = 'cursor';
      element.after(cursor);

      const speed = Math.max(20, Math.min(50, 1500 / text.length));

      function type() {
        if (i < text.length) {
          element.textContent += text.charAt(i);
          i++;
          scrollToBottom();
          setTimeout(type, speed + Math.random() * 20);
        } else {
          cursor.remove();
        }
      }
      type();
    }

    function showTypingIndicator(role) {
      const indicator = document.getElementById('typingIndicator');
      const text = document.getElementById('typingText');
      text.textContent = `${role.toUpperCase()} is typing...`;
      indicator.classList.add('active');

      clearTimeout(typingTimeout);
      typingTimeout = setTimeout(hideTypingIndicator, 3000);
    }

    function hideTypingIndicator() {
      document.getElementById('typingIndicator').classList.remove('active');
    }

    function scrollToBottom() {
      const messages = document.getElementById('messages');
      messages.scrollTop = messages.scrollHeight;
    }

    // Reset handler
    socket.on('reset', () => {
      document.getElementById('messages').innerHTML = '';
    });

    function resetChat() {
      if (confirm('Clear all transmissions?')) {
        fetch('/reset', { method: 'POST' });
      }
    }

    document.getElementById('resetBtn').addEventListener('click', resetChat);

    // Cmd+\ (Mac) or Ctrl+\ (Windows) to reset
    document.addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === '\\') {
        e.preventDefault();
        resetChat();
      }
    });

    // Input handling
    const input = document.getElementById('inputField');

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && input.value.trim()) {
        socket.emit('message', {
          role: myRole,
          text: input.value.trim()
        });
        socket.emit('stop-typing', { role: myRole });
        input.value = '';
      }
    });

    input.addEventListener('input', () => {
      if (input.value.trim()) {
        socket.emit('typing', { role: myRole });
      } else {
        socket.emit('stop-typing', { role: myRole });
      }
    });
  </script>
</body>
</html>
