<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COMMS TERMINAL</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --captain-color: #00ffcc;
      --architect-color: #ff6b35;
      --bg-primary: #0a0e14;
      --bg-secondary: #111922;
      --border-color: #1a2a3a;
      --text-dim: #4a6a7a;
      --scanline-opacity: 0.03;
    }

    body {
      background: var(--bg-primary);
      color: #c0d0e0;
      font-family: 'JetBrains Mono', monospace;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* Scanline effect */
    body::after {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0, 255, 204, var(--scanline-opacity)) 2px,
        rgba(0, 255, 204, var(--scanline-opacity)) 4px
      );
      z-index: 1000;
    }

    /* CRT flicker */
    @keyframes flicker {
      0%, 100% { opacity: 1; }
      92% { opacity: 1; }
      93% { opacity: 0.8; }
      94% { opacity: 1; }
    }

    body {
      animation: flicker 8s infinite;
    }

    .container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Header */
    .header {
      border: 1px solid var(--border-color);
      padding: 15px 20px;
      margin-bottom: 20px;
      background: var(--bg-secondary);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-title {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    .header-status {
      font-size: 11px;
      color: var(--text-dim);
    }

    .header-status .online {
      color: #00ff88;
    }

    /* Messages area */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 0;
      scroll-behavior: smooth;
    }

    .messages::-webkit-scrollbar {
      width: 4px;
    }

    .messages::-webkit-scrollbar-track {
      background: var(--bg-primary);
    }

    .messages::-webkit-scrollbar-thumb {
      background: var(--border-color);
    }

    .message {
      margin-bottom: 24px;
      padding-left: 20px;
      border-left: 2px solid var(--border-color);
      animation: messageIn 0.3s ease-out;
    }

    @keyframes messageIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message.captain {
      border-left-color: var(--captain-color);
    }

    .message.architect {
      border-left-color: var(--architect-color);
    }

    .message-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 6px;
    }

    .message-role {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .message.captain .message-role {
      color: var(--captain-color);
    }

    .message.architect .message-role {
      color: var(--architect-color);
    }

    .message-time {
      font-size: 10px;
      color: var(--text-dim);
    }

    .message-text {
      font-size: 16px;
      line-height: 1.6;
      font-weight: 300;
    }

    .message-text .cursor {
      display: inline-block;
      width: 8px;
      height: 18px;
      background: currentColor;
      margin-left: 2px;
      animation: blink 0.6s step-end infinite;
      vertical-align: text-bottom;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* Typing indicator */
    .typing-indicator {
      padding-left: 20px;
      margin-bottom: 16px;
      font-size: 11px;
      color: var(--text-dim);
      opacity: 0;
      transition: opacity 0.3s;
    }

    .typing-indicator.active {
      opacity: 1;
    }

    /* Input area */
    .input-area {
      border: 1px solid var(--border-color);
      background: var(--bg-secondary);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .input-prompt {
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
    }

    .captain-view .input-prompt {
      color: var(--captain-color);
    }

    .architect-view .input-prompt {
      color: var(--architect-color);
    }

    .input-field {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #c0d0e0;
      font-family: 'JetBrains Mono', monospace;
      font-size: 16px;
      font-weight: 300;
    }

    .input-field::placeholder {
      color: var(--text-dim);
    }

    .send-hint {
      font-size: 10px;
      color: var(--text-dim);
    }

    /* Role selection */
    .role-select {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--bg-primary);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 2000;
    }

    .role-select h1 {
      font-size: 12px;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 40px;
    }

    .role-buttons {
      display: flex;
      gap: 30px;
    }

    .role-btn {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      color: #c0d0e0;
      font-family: 'JetBrains Mono', monospace;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      padding: 30px 50px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .role-btn:hover {
      border-color: var(--captain-color);
      color: var(--captain-color);
      box-shadow: 0 0 20px rgba(0, 255, 204, 0.1);
    }

    .role-btn:last-child:hover {
      border-color: var(--architect-color);
      color: var(--architect-color);
      box-shadow: 0 0 20px rgba(255, 107, 53, 0.1);
    }

    /* Ambient glow */
    .ambient-glow {
      position: fixed;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      pointer-events: none;
      background: radial-gradient(ellipse at 50% 50%, rgba(0, 255, 204, 0.02) 0%, transparent 70%);
      z-index: -1;
    }
  </style>
</head>
<body>
  <div class="ambient-glow"></div>

  <!-- Role selection screen -->
  <div class="role-select" id="roleSelect">
    <h1>Identify yourself</h1>
    <div class="role-buttons">
      <button class="role-btn" onclick="selectRole('captain')">Captain</button>
      <button class="role-btn" onclick="selectRole('architect')">Architect</button>
    </div>
  </div>

  <!-- Chat interface -->
  <div class="container" id="chatContainer" style="display:none;">
    <div class="header">
      <div class="header-title" id="headerTitle">COMMS TERMINAL</div>
      <div class="header-status">
        <span>CHANNEL OPEN</span> · <span class="online">ENCRYPTED</span>
      </div>
    </div>

    <div class="messages" id="messages"></div>

    <div class="typing-indicator" id="typingIndicator">
      <span id="typingText"></span>
    </div>

    <div class="input-area">
      <span class="input-prompt" id="inputPrompt">&gt;</span>
      <input type="text" class="input-field" id="inputField" placeholder="Enter transmission..." autocomplete="off" />
      <span class="send-hint">ENTER TO TRANSMIT</span>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let myRole = null;
    let typingTimeout = null;

    // Auto-detect role from URL
    const path = window.location.pathname;
    if (path === '/captain') {
      selectRole('captain');
    } else if (path === '/architect') {
      selectRole('architect');
    }

    function selectRole(role) {
      myRole = role;
      document.getElementById('roleSelect').style.display = 'none';
      document.getElementById('chatContainer').style.display = 'flex';
      document.body.classList.add(role + '-view');

      const prompt = role === 'captain' ? 'CAPTAIN >' : 'ARCHITECT >';
      document.getElementById('inputPrompt').textContent = prompt;
      document.getElementById('headerTitle').textContent =
        `COMMS TERMINAL — ${role.toUpperCase()}`;

      socket.emit('join', role);
      document.getElementById('inputField').focus();
    }

    // Handle message history
    socket.on('history', (msgs) => {
      msgs.forEach(msg => renderMessage(msg, false));
      scrollToBottom();
    });

    // Handle new messages
    socket.on('message', (msg) => {
      // Remove live preview if this is the finalized version
      if (msg.role !== myRole && liveMessageDiv) {
        liveMessageDiv.remove();
        liveMessageDiv = null;
        liveMessageEl = null;
        liveCursor = null;
      }
      renderMessage(msg, false);
      scrollToBottom();
    });

    // Handle live keystrokes from other party
    let liveMessageEl = null;
    let liveCursor = null;
    let liveMessageDiv = null;

    socket.on('live-keystroke', (data) => {
      if (data.role === myRole) return;

      if (!liveMessageDiv) {
        const container = document.getElementById('messages');
        liveMessageDiv = document.createElement('div');
        liveMessageDiv.className = `message ${data.role}`;
        liveMessageDiv.innerHTML = `
          <div class="message-header">
            <span class="message-role">${data.role}</span>
            <span class="message-time">LIVE</span>
          </div>
          <div class="message-text"><span class="text-content"></span></div>
        `;
        container.appendChild(liveMessageDiv);
        liveMessageEl = liveMessageDiv.querySelector('.text-content');
        liveCursor = document.createElement('span');
        liveCursor.className = 'cursor';
        liveMessageEl.after(liveCursor);
      }

      liveMessageEl.textContent = data.text;
      scrollToBottom();
    });

    socket.on('live-clear', (data) => {
      if (data.role === myRole) return;
      if (liveMessageDiv) {
        liveMessageDiv.remove();
        liveMessageDiv = null;
        liveMessageEl = null;
        liveCursor = null;
      }
    });

    function renderMessage(msg, typewriter) {
      const container = document.getElementById('messages');
      const div = document.createElement('div');
      div.className = `message ${msg.role}`;

      const time = new Date(msg.timestamp).toLocaleTimeString('en-US', {
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        hour12: false
      });

      div.innerHTML = `
        <div class="message-header">
          <span class="message-role">${msg.role}</span>
          <span class="message-time">${time}</span>
        </div>
        <div class="message-text"><span class="text-content"></span></div>
      `;

      container.appendChild(div);
      const textEl = div.querySelector('.text-content');

      if (typewriter && msg.text.length > 0) {
        typewriterEffect(textEl, msg.text);
      } else {
        textEl.textContent = msg.text;
      }
    }

    function typewriterEffect(element, text) {
      let i = 0;
      const cursor = document.createElement('span');
      cursor.className = 'cursor';
      element.after(cursor);

      const speed = Math.max(20, Math.min(50, 1500 / text.length));

      function type() {
        if (i < text.length) {
          element.textContent += text.charAt(i);
          i++;
          scrollToBottom();
          setTimeout(type, speed + Math.random() * 20);
        } else {
          cursor.remove();
        }
      }
      type();
    }

    function showTypingIndicator(role) {
      const indicator = document.getElementById('typingIndicator');
      const text = document.getElementById('typingText');
      text.textContent = `${role.toUpperCase()} is composing...`;
      indicator.classList.add('active');

      clearTimeout(typingTimeout);
      typingTimeout = setTimeout(hideTypingIndicator, 3000);
    }

    function hideTypingIndicator() {
      document.getElementById('typingIndicator').classList.remove('active');
    }

    function scrollToBottom() {
      const messages = document.getElementById('messages');
      messages.scrollTop = messages.scrollHeight;
    }

    // Reset handler
    socket.on('reset', () => {
      document.getElementById('messages').innerHTML = '';
    });

    // Cmd+Shift+R (Mac) or Ctrl+Shift+R (Windows) to reset
    document.addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.shiftKey && e.key === 'R') {
        e.preventDefault();
        if (confirm('Clear all transmissions?')) {
          fetch('/reset', { method: 'POST' });
        }
      }
    });

    // Input handling
    const input = document.getElementById('inputField');

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && input.value.trim()) {
        socket.emit('message', {
          role: myRole,
          text: input.value.trim()
        });
        socket.emit('live-clear', { role: myRole });
        input.value = '';
      }
    });

    input.addEventListener('input', () => {
      socket.emit('live-keystroke', { role: myRole, text: input.value });
    });
  </script>
</body>
</html>
